<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Uni Dashboard</title>
    <style>
        @font-face {
            font-family: Gyahegi;
            src: url(./Media/Gyahegi.otf);
        }
        @font-face {
            font-family: Garges;
            src: url("./Media/Garges.ttf")
        }
        .mainFlex {
            display: flex;
            flex-direction: column;
            justify-content: center; 
            margin: 5px;
            padding: 5px;
            background-color: #d8e2da;
            border-radius: 5px;
        }
        #header {
            font-family: Gyahegi; 
            margin: 5px;
            font-size: 20px;
            text-align: center;
        }
        .text {
            font-family: 'Times New Roman', Times, serif;
            margin: 5px;
            font-size: 20;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="mainFlex">
            <p id="header">Next Exam: </p>
            <p class="text" style="font-weight: bold;">Skriftlig Fysiologieksamen</p>
            <p id="daysleftP1" class="text"></p>
            <p class="text" style="font-weight: bold;">Muntlig Anatomieksamen</p>
            <p id="daysleftP2" class="text"></p>
    </div>
    <script>
        let currentdate = new Date();
        let oneday = 24*60*60*1000; // hours*min*sec*millisec
        
        let daysleftEl1 = document.getElementById("daysleftP1");
        let examdate1 = new Date(2025, 10-1, 17); //enter the date of the exam (with -1 in months) 
        
        let daysleftEl2 = document.getElementById("daysleftP2");
        let examdate2 = new Date(2025, 10-1, 29); // enter the date of the exam (with -1 in months)

        daysleftEl1.innerHTML = Math.round(Math.abs((examdate1 - currentdate)/oneday)) + " dager igjen";
        daysleftEl2.innerHTML = Math.round(Math.abs((examdate2 - currentdate)/oneday)) + " dager igjen";
    </script>
    
</body>
</html>
